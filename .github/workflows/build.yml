
name: Build TORI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TORI_AI_LIVE_Android_Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Ambil proyek
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Periksa Android SDK
        run: |
          echo "Android SDK:"
          ls "$ANDROID_HOME"
          echo "Platform:"
          ls "$ANDROID_HOME/platforms"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ekstrak proyek
        run: |
          unzip TORI_AI_LIVE_Android_Project.zip -d extracted

      - name: Bangun APK
        run: |
          gradle -p extracted/TORI_AI_LIVE_Android_Project assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: TORI-AI-LIVE-APK
          path: extracted/TORI_AI_LIVE_Android_Project/app/build/outputs/apk/debug/app-debug.apk

